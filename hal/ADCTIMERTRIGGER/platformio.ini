; ============================================================================
;  CubeMX + PlatformIO 通用 platformio.ini
;  用法：整个文件复制到 CubeMX 工程的根目录（和 .ioc 文件同一层）
;  注意：这个文件 CubeMX 不认识，重新 GENERATE CODE 不会覆盖它
;        —— 一个工程建一次就行，不是每次都要复制
; ============================================================================


; ---------------------------------------------------------------------------
;  第 1 段：死的东西，原文照抄，不要动
; ---------------------------------------------------------------------------
[platformio]
src_dir     = Core/Src     ; 告诉 PIO 代码在 Core/Src，不是它默认的 src/
include_dir = Core/Inc     ; 头文件搜索走 CubeMX 的 Core/Inc


; ---------------------------------------------------------------------------
;  第 2 段：一次只改这一小段
; ---------------------------------------------------------------------------
[env:genericSTM32F103C8]         ; ① 板子名，要和下面 board 一模一样
platform  = ststm32
framework = stm32cube            ; 用 PIO 自带的整套 HAL
board     = genericSTM32F103C8   ; ① 同上

upload_protocol = stlink         ; ② 烧录器，三选一见文末
debug_tool      = stlink
monitor_speed   = 115200         ; ③ 串口助手波特率

; ④ 给编译器的芯片说明。换芯片时这里也要跟着改
build_flags =
  -DSTM32F103xB                   ; 中容量芯片（C8/CB/RB…）。小容量改 STM32F103x6，大容量改 STM32F103xE
  -DUSE_HAL_DRIVER
  -DHSE_VALUE=8000000U            ; 外部晶振 8MHz。蓝药丸就是 8M，没有外部晶振的板子这行没影响

; ============================================================
;  ⚠⚠ 这里绝对、绝对不要再写 -IDrivers/... 这类东西 ⚠⚠
;
;  原因：framework = stm32cube 已经从网上拉了一整套 HAL 在编译。
;  如果你再用 -I 指到本地 CubeMX 的 Drivers/，头文件用的是本地的
;  （新版本），实现用的是 PIO 的（旧版本），两边对不上，就会报：
;
;      error: conflicting types for 'HAL_RCC_OscConfig'
;      error: conflicting types for 'HAL_RCC_ClockConfig'
;
;  一共几百行红字，看着吓人，其实就是这一句造成的。
;
;  CubeMX 生成的 Drivers/ 目录不用删、不用管，它躺在那里不参与编译。
; ============================================================


; ---------------------------------------------------------------------------
;  ③ 烧录器怎么选（upload_protocol / upload_port）
; ---------------------------------------------------------------------------
;  ST-Link（最常见，最省心，推荐）：
;      upload_protocol = stlink
;      debug_tool      = stlink
;
;  USB 转 TTL 串口下载（接 PA9=TX、PA10=RX，下载时 BOOT0 跳线拉到 1）：
;      upload_protocol = serial
;      upload_port     = /dev/cu.usbserial-0001     ; Mac 上先 ls /dev/cu.* 看真名
;
;  J-Link：
;      upload_protocol = jlink
;      debug_tool      = jlink


; ---------------------------------------------------------------------------
;  ④ 板子对照表：换芯片就照这张表改，四处要一起改
; ---------------------------------------------------------------------------
;  芯片            [env: 和 board]          build_flags 里的宏
;  ----------------------------------------------------------------------
;  F103C8T6 蓝药丸  genericSTM32F103C8      -DSTM32F103xB    ← 你现在用的
;  F103C6T6        genericSTM32F103C6      -DSTM32F103x6
;  F103CBT6        genericSTM32F103CB      -DSTM32F103xB
;  F103RCT6        genericSTM32F103RC      -DSTM32F103xE
;  F103RET6        genericSTM32F103RE      -DSTM32F103xE
;  F103ZET6        genericSTM32F103ZE      -DSTM32F103xE
;  F407VET6        genericSTM32F407VET6    -DSTM32F407xx
;
;  ⚠ 换成 F4 时还要把 framework 那行留着、platform 留着，
;    但 .ioc 里的芯片型号必须也一起换，四个地方对不上必然编不过。
