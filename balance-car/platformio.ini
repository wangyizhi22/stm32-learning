;============================================================================
;  bal_hal —— PlatformIO 工程配置
;  代码结构：Core/（CubeMX 风格）+ MyLib/User/Test（平衡车业务代码）
;  本地 Drivers/ 不参与编译，HAL 由 framework=stm32cube 提供（PIO 自带）
; ============================================================================

[platformio]
src_dir     = .
include_dir = Core/Inc


[env:genericSTM32F103C8]
platform  = ststm32
framework = stm32cube
board     = genericSTM32F103C8

upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200

build_flags =
  -DSTM32F103xB
  -DUSE_HAL_DRIVER
  -DHSE_VALUE=8000000U
  -I MyLib/Inc
  -I User/Inc
  -I Test/Inc


; 只编译这四个目录里的 .c，其余（Drivers/.pio/build/…）都不碰。
; system_stm32f1xx.c 由 framework 自带，这里排除，避免和 Core/Src 里的重复。
src_filter =
  +<Core/Src/*.c>
  +<MyLib/Src/*.c>
  +<User/Src/*.c>
  +<Test/Src/*.c>
  -<Core/Src/system_stm32f1xx.c>
